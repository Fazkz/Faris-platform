<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جدول متابعة المقررات الدراسية الشامل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 20px; direction: rtl; }
        h2 { text-align: center; color: #333; }
        .table-container { overflow-x: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 1000px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 11px; }
        th { background-color: #004080; color: #fff; }
        .course-name { text-align: right; font-weight: bold; background-color: #eef2f7; width: 190px; font-size: 12px; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin: 0 auto; }
        .box {
            width: 22px;
            height: 22px;
            border: 1px solid #004080;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 9px;
            border-radius: 3px;
            user-select: none;
            transition: 0.2s;
        }
        .box.checked {
            background-color: #28a745;
            color: #fff;
            border-color: #1e7e34;
        }
        .box.checked::after {
            content: "✓";
            font-weight: bold;
            font-size: 11px;
        }
        .box.checked span {
            display: none;
        }
        .final-exam-info {
            font-size: 10px;
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>جدول متابعة المقررات الدراسية (انقر على الحقل لتحديد ✅)</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>المادة الدراسية</th>
                    <th>نظري</th>
                    <th>عملي</th>
                    <th>الوحدات (للحاسب)</th>
                    <th>أنشطة (3)</th>
                    <th>واجبات (3)</th>
                    <th>البحوث والعروض التقديمية</th>
                    <th>فصلي</th>
                    <th>الاختبار النهائي (الفاينل)</th>
                </tr>
            </thead>
            <tbody id="tracker-body">
                </tbody>
        </table>
    </div>

<script>
    const courses = [
        { 
            name: "CS 101 - مقدمة في الحاسب الآلي", 
            theory: 6, practical: 0, units: 12, activities: 3, homework: 3, research: 1, midtermsCount: 1,
            finalExam: "13-07-1448 هـ<br>[08:00 ص - 10:00 ص]" 
        },
        { 
            name: "CNUT318 - الكيمياء الحيوية التغذوية", 
            theory: 20, practical: 20, units: 0, activities: 3, homework: 3, research: 1, midtermsCount: 2,
            finalExam: "28-07-1448 هـ<br>[10:30 ص - 12:30 م]" 
        },
        { 
            name: "FSNU314 - كيمياء وتحليل الأغذية", 
            theory: 20, practical: 20, units: 0, activities: 3, homework: 3, research: 1, midtermsCount: 2,
            finalExam: "18-07-1448 هـ<br>[08:00 ص - 10:00 ص]" 
        },
        { 
            name: "FSNU344 - أسس التغذية العلاجية", 
            theory: 18, practical: 20, units: 0, activities: 3, homework: 3, research: 1, midtermsCount: 2,
            finalExam: "25-07-1448 هـ<br>[08:00 ص - 10:00 ص]" 
        },
        { 
            name: "FSNU311 - شؤون صحية غذائية", 
            theory: 20, practical: 20, units: 0, activities: 3, homework: 3, research: 1, midtermsCount: 2,
            finalExam: "26-07-1448 هـ<br>[10:30 ص - 12:30 م]" 
        },
        { 
            name: "FSNU322 - أسس تقنية الألبان", 
            theory: 18, practical: 18, units: 0, activities: 3, homework: 3, research: 1, midtermsCount: 2,
            finalExam: "20-07-1448 هـ<br>[08:00 ص - 10:00 ص]" 
        },
        { 
            name: "FSNU341 - التغذية والمناعة في الإنسان", 
            theory: 18, practical: 0, units: 0, activities: 3, homework: 3, research: 1, midtermsCount: 2,
            finalExam: "21-07-1448 هـ<br>[10:30 ص - 12:30 م]" 
        },
        { 
            name: "FSNU455 - دراسات خاصة في الأغذية", 
            theory: 0, practical: 1, units: 0, activities: 0, homework: 0, research: 1, midtermsCount: 0,
            finalExam: "لم يُحدد من الكلية" 
        }
    ];

    const tbody = document.getElementById('tracker-body');

    courses.forEach((course) => {
        const tr = document.createElement('tr');
        
        // 1. اسم المقرر
        const tdName = document.createElement('td');
        tdName.className = 'course-name';
        tdName.innerText = course.name;
        tr.appendChild(tdName);

        // دالة إنشاء المربعات
        function createBoxes(count, maxWidth) {
            const container = document.createElement('div');
            container.className = 'grid-container';
            container.style.maxWidth = maxWidth + 'px';
            for (let i = 1; i <= count; i++) {
                const box = document.createElement('div');
                box.className = 'box';
                const span = document.createElement('span');
                span.innerText = count === 1 ? "✓" : i;
                if(count === 1) span.style.display = "block"; // جعل الحقل الفردي جاهز بالعلامة أو الرقم
                box.appendChild(span);
                box.addEventListener('click', function() { 
                    this.classList.toggle('checked'); 
                    if(count === 1) {
                        this.querySelector('span').style.display = this.classList.contains('checked') ? "none" : "block";
                    }
                });
                container.appendChild(box);
            }
            return container;
        }

        // 2. النظري
        const tdTheory = document.createElement('td');
        tdTheory.appendChild(course.theory > 0 ? createBoxes(course.theory, 150) : document.createTextNode("-"));
        tr.appendChild(tdTheory);

        // 3. العملي
        const tdPractical = document.createElement('td');
        tdPractical.appendChild(course.practical > 0 ? createBoxes(course.practical, 150) : document.createTextNode("-"));
        tr.appendChild(tdPractical);

        // 4. الوحدات (للحاسب)
        const tdUnits = document.createElement('td');
        tdUnits.appendChild(course.units > 0 ? createBoxes(course.units, 120) : document.createTextNode("-"));
        tr.appendChild(tdUnits);

        // 5. الأنشطة (3)
        const tdActivities = document.createElement('td');
        tdActivities.appendChild(course.activities > 0 ? createBoxes(course.activities, 70) : document.createTextNode("-"));
        tr.appendChild(tdActivities);

        // 6. الواجبات (3)
        const tdHomework = document.createElement('td');
        tdHomework.appendChild(course.homework > 0 ? createBoxes(course.homework, 70) : document.createTextNode("-"));
        tr.appendChild(tdHomework);

        // 7. البحوث والعروض التقديمية (1)
        const tdResearch = document.createElement('td');
        tdResearch.appendChild(course.research > 0 ? createBoxes(course.research, 40) : document.createTextNode("-"));
        tr.appendChild(tdResearch);

        // 8. الاختبارات الفصلية
        const tdMidterms = document.createElement('td');
        if (course.midtermsCount > 0) {
            const gridMidterms = document.createElement('div');
            gridMidterms.className = 'grid-container';
            gridMidterms.style.maxWidth = '50px';
            for (let i = 1; i <= course.midtermsCount; i++) {
                const box = document.createElement('div');
                box.className = 'box';
                const span = document.createElement('span');
                span.innerText = course.midtermsCount === 1 ? "ف" : "ف" + i;
                box.appendChild(span);
                box.addEventListener('click', function() { this.classList.toggle('checked'); });
                gridMidterms.appendChild(box);
            }
            tdMidterms.appendChild(gridMidterms);
        } else {
            tdMidterms.innerText = "-";
        }
        tr.appendChild(tdMidterms);

        // 9. الاختبار النهائي
        const tdFinal = document.createElement('td');
        tdFinal.className = 'final-exam-info';
        tdFinal.innerHTML = course.finalExam;
        tr.appendChild(tdFinal);

        tbody.appendChild(tr);
    });
</script>

</body>
</html>
