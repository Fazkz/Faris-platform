<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مولد أكواد الغذاء مع الحفظ والنسخ والحذف</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- خط عربي -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    textarea, select, input { font-size: 14px; }
  </style>
</head>
<body class="bg-gray-50 p-6">

  <h1 class="text-2xl font-bold text-center mb-6">مولد أكواد الغذاء — الحفظ والنسخ والحذف</h1>

  <!-- النموذج -->
  <form id="foodForm" class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow space-y-4">
    <div>
      <label class="block mb-1 font-semibold">اسم الطعام</label>
      <input id="name" name="name" type="text" required placeholder="مثال: خيار" class="w-full border rounded p-2" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block mb-1 font-semibold">السعرات (لكل 100 جم)</label>
        <input id="calories" name="calories" type="number" step="any" min="0" required placeholder="مثال: 16" class="w-full border rounded p-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">الدهون (جم)</label>
        <input id="fat" name="fat" type="number" step="any" min="0" required placeholder="مثال: 0.1" class="w-full border rounded p-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">الكربوهيدرات (جم)</label>
        <input id="carb" name="carb" type="number" step="any" min="0" required placeholder="مثال: 3.6" class="w-full border rounded p-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">البروتين (جم)</label>
        <input id="protein" name="protein" type="number" step="any" min="0" required placeholder="مثال: 0.7" class="w-full border rounded p-2" />
      </div>
    </div>

    <!-- التصنيف الأساسي -->
    <div>
      <label class="block mb-1 font-semibold">التصنيف الأساسي</label>
      <select id="category" name="category" required class="w-full border rounded p-2">
        <option value="">اختر التصنيف</option>
      </select>
    </div>

    <!-- التصنيف الفرعي -->
    <div>
      <label class="block mb-1 font-semibold">التصنيف الفرعي</label>
      <select id="subcategory" name="subcategory" required class="w-full border rounded p-2">
        <option value="">اختر التصنيف الفرعي</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold">➕ إضافة الكود</button>
  </form>

  <!-- الأكواد الناتجة -->
  <section class="max-w-xl mx-auto mt-6 bg-white p-6 rounded-lg shadow">
    <h2 class="font-semibold mb-2">الأكواد الناتجة</h2>
    <textarea id="output" readonly rows="10" class="w-full border rounded p-3 font-mono text-sm bg-gray-100"></textarea>
    <button id="copyBtn" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded flex items-center justify-center gap-2">
      <i class="fa-solid fa-copy"></i> نسخ الكود
    </button>
  </section>

  <!-- الأكواد المحفوظة -->
  <section class="max-w-xl mx-auto mt-6 bg-white p-6 rounded-lg shadow">
    <h2 class="font-semibold mb-2">الأكواد المحفوظة في المتصفح (localStorage)</h2>
    <textarea id="savedCodes" readonly rows="10" class="w-full border rounded p-3 font-mono text-sm bg-yellow-50"></textarea>

    <div class="mt-3 flex gap-2">
      <button id="moveToSavedBtn" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white py-2 rounded flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-right"></i> نقل للحافظة
      </button>
      <button id="copySavedBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded flex items-center justify-center gap-2">
        <i class="fa-solid fa-copy"></i> نسخ الأكواد المحفوظة
      </button>
      <button id="clearSavedBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded flex items-center justify-center gap-2">
        <i class="fa-solid fa-trash"></i> حذف الأكواد المحفوظة
      </button>
    </div>
  </section>

  <script>
    /**********************
     * بيانات التصنيفات
     **********************/
const categoriesData = {
  "الفواكه والخضروات": {
    icon: "fas fa-apple-alt",
    subcategories: ["فواكه", "خضراوات", "ورقيات", "سلطات", "عصائر طبيعية", "فواكة مجمدة", "خضراوات مجمدة", "مجففه"]
  },
  "الحليب و مشتقاته": {
    icon: "fa-solid fa-cheese",
    subcategories: ["الحليب", "الالبان", "الاجبان", "لبنه", "زبادي", "قشطة", "كريمة", "حليب مكثف", "حليب شاهي", "منتجات اخرى"]
  },
  "المخبوزات": {
    icon: "fa-solid fa-bread-slice",
    subcategories: ["مفرود", "صامولي و خبز برجر", "توست", "تورتيلا", "فطائر", "شابورة", "معمول", "مقرمشات", "مخبوزات صحية"]
  },
  "المشروبات": {
    icon: "fa-solid fa-bottle-water",
    subcategories: ["مشروبات غازية", "مشروب شاي مثلج", "مشروبات طاقة", "مشروبات ساخنة", "مشروبات باردة", "عصائر", "اظرف سريعة التحضير"]
  },
  "السكريات": {
    icon: "fa-solid fa-ice-cream",
    subcategories: ["🍦ايسكريم", "شوكولاتة", "تمور", "كيك", "حلويات شرقية", "مارشميلو", "علك", "سكر"]
  },
  "موالح": {
    icon: "fa-solid fa-cookie-bite",
    subcategories: ["🍿شبسات", "فصفص", "مكسرات"]
  },
  "المعلبات": {
    icon: "bx bx-box",
    subcategories: ["حلاوة طحينية", "المربى", "الفول السوداني", "فواكة معلبة", "خضروات معلبة", "اسماك معلبة", "صلصات معلبة"]
  },
  "اللحوم والبيض": {
    icon: "fas fa-drumstick-bite",
    subcategories: ["بيض🥚", "لحم غنم🐑", "دواجن🐓", "بحريات🐟", "لحم بقري🐄", "لحم جمل🐪"]
  },
  "الحبوب والبذور": {
    icon: "fas fa-seedling",
    subcategories: ["حبوب كاملة", "رز🍚", "مكرونة🍝", "شعبيات", "شوربات", "كورن فليكس", "طحين", "بذور"]
  },
  "الصلصات والإضافات": {
    icon: "fa-solid fa-wine-bottle",
    subcategories: [
      "معجون و صلصة الطماطم",
      "كاتشب و مايونيز",
      "➕إضافات للطعام",
      "صلصات البيتزا و الباستا",
      "صلصات الباربكيو و الصويا",
      "صلصات حارة",
      "خل"
    ]
  },
  "الزيوت و الدهون ": {
    icon: "fas fa-oil-can",
    subcategories: ["زيوت صحية", "زيوت", "زبدة", "صلصات"]
  },
  "مطاعم عالميه": {
    icon: "fa-solid fa-shop",
    subcategories: ["ماكدونالدز🍔", "🍗كنتاكي", "🍗هارديز", "🥪كودو", "دومينوز🍕"]
  }
};

    /**********************
     * عناصر الواجهة
     **********************/
    const categorySelect = document.getElementById('category');
    const subcategorySelect = document.getElementById('subcategory');
    const form = document.getElementById('foodForm');
    const outputEl = document.getElementById('output');
    const savedCodesEl = document.getElementById('savedCodes');
    const copyBtn = document.getElementById('copyBtn');
    const moveToSavedBtn = document.getElementById('moveToSavedBtn');
    const copySavedBtn = document.getElementById('copySavedBtn');
    const clearSavedBtn = document.getElementById('clearSavedBtn');

    // المفتاح في localStorage
    const STORAGE_KEY = 'savedFoodCodes';

    // الأكواد المؤقتة (الجلسة الحالية)
    let codes = [];

    // الأكواد المحفوظة (مأخوذة من localStorage)
    let saved = [];

    /**********************
     * دوال مساعدة
     **********************/
    function transliterateArabic(text) {
      if (!text) return '';
      const map = {
        'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh',
        'د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z',
        'ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y',
        'ى':'a','ء':'a','ئ':'e','ؤ':'o','ة':'h',' ':'_','-':'_','_':'_'
      };
      return text
        .toLowerCase()
        .split('')
        .map(ch => map[ch] ?? ch)
        .join('')
        .replace(/[^a-z0-9_]/g,'')
        .replace(/_+/g,'_')
        .replace(/^_+|_+$/g,'');
    }

    // تحديث textarea للأكواد المحفوظة من المصفوفة saved
    function refreshSavedTextarea() {
      savedCodesEl.value = saved.length ? saved.join('\n\n') : '';
    }

    // تحديث textarea للأكواد المؤقتة من المصفوفة codes
    function refreshOutputTextarea() {
      outputEl.value = codes.length ? codes.join('\n\n') : '';
    }

    // تحميل saved من localStorage عند البداية
    function loadSavedFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        saved = raw ? JSON.parse(raw) : [];
      } catch (err) {
        saved = [];
        console.error('خطأ بقراءة localStorage:', err);
      }
      refreshSavedTextarea();
    }

    // حفظ saved إلى localStorage
    function saveSavedToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      } catch (err) {
        console.error('خطأ بحفظ localStorage:', err);
      }
    }

    /**********************
     * تهيئة الصفحة
     **********************/
    function init() {
      // تعبئة قائمة التصنيفات الأساسية
      Object.keys(categoriesData).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });

      // تحميل الأكواد المحفوظة من التخزين
      loadSavedFromStorage();

      // مسح المسودات وتهيئة المساحات
      codes = [];
      refreshOutputTextarea();
    }

    // نفّذ التهيئة بعد تحميل DOM
    document.addEventListener('DOMContentLoaded', init);

    /**********************
     * حدث تغيير التصنيف الأساسي → تحديث التصنيف الفرعي
     **********************/
    categorySelect.addEventListener('change', () => {
      // إعادة تهيئة الفرعي
      subcategorySelect.innerHTML = '<option value="">اختر التصنيف الفرعي</option>';
      const cat = categorySelect.value;
      if (cat && categoriesData[cat]) {
        categoriesData[cat].subcategories.forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          subcategorySelect.appendChild(opt);
        });
      }
    });

    /**********************
     * حدث إرسال النموذج — توليد الكود
     **********************/
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = (document.getElementById('name').value || '').trim();
      const calories = parseFloat(document.getElementById('calories').value || 0);
      const fat = parseFloat(document.getElementById('fat').value || 0);
      const carb = parseFloat(document.getElementById('carb').value || 0);
      const protein = parseFloat(document.getElementById('protein').value || 0);
      const category = categorySelect.value || '';
      const subcategory = subcategorySelect.value || '';

      if (!name) {
        alert('أدخل اسم الطعام');
        return;
      }
      if (!category || !subcategory) {
        alert('اختر التصنيف الأساسي والفرعي');
        return;
      }

      // توليد id إنجليزي آمن
      const id = transliterateArabic(name) || 'item';

      // تكوين كود الكائن كنص
      const code = `{
  id: "${id}",
  name: "${name}",
  image: "sss",
  calories: ${isNaN(calories) ? 0 : calories},
  fat: ${isNaN(fat) ? 0 : fat},
  protein: ${isNaN(protein) ? 0 : protein},
  carb: ${isNaN(carb) ? 0 : carb},
  category: "${category}",
  subcategory: "${subcategory}",
},`;

      // إضافة إلى مصفوفة الأكواد المؤقتة وعرضها
      codes.push(code);
      refreshOutputTextarea();

      // إعادة تعيين النموذج مع إبقاء اختيار التصنيف فارغ (اختياري)
      form.reset();
      // إعادة وضع خيارات الفرعي للانتظار
      subcategorySelect.innerHTML = '<option value="">اختر التصنيف الفرعي</option>';
      // ترك التركيز على الاسم
      document.getElementById('name').focus();
    });

    /**********************
     * زر نسخ الأكواد الناتجة
     **********************/
    copyBtn.addEventListener('click', async () => {
      if (!outputEl.value) {
        alert('لا توجد أكواد للنسخ.');
        return;
      }
      try {
        await navigator.clipboard.writeText(outputEl.value);
        const prev = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ!';
        setTimeout(() => { copyBtn.innerHTML = prev; }, 1500);
      } catch (err) {
        alert('فشل النسخ. تأكد من صلاحية المتصفح.');
        console.error(err);
      }
    });

    /**********************
     * زر نقل الأكواد إلى الحافظة (localStorage)
     **********************/
    moveToSavedBtn.addEventListener('click', () => {
      if (codes.length === 0) {
        alert('لا توجد أكواد مؤقتة للنقل.');
        return;
      }

      // أضف العناصر المؤقتة إلى المصفوفة المحفوظة
      saved = saved.concat(codes);

      // حفظها في localStorage
      saveSavedToStorage();

      // تحديث مساحة العرض
      refreshSavedTextarea();

      // مسح المسودة الحالية
      codes = [];
      refreshOutputTextarea();

      // ترك التركيز
      document.getElementById('name').focus();
    });

    /**********************
     * زر نسخ الأكواد المحفوظة
     **********************/
    copySavedBtn.addEventListener('click', async () => {
      if (!savedCodesEl.value) {
        alert('لا توجد أكواد محفوظة للنسخ.');
        return;
      }
      try {
        await navigator.clipboard.writeText(savedCodesEl.value);
        const prev = copySavedBtn.innerHTML;
        copySavedBtn.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ!';
        setTimeout(() => { copySavedBtn.innerHTML = prev; }, 1500);
      } catch (err) {
        alert('فشل النسخ. تأكد من صلاحية المتصفح.');
        console.error(err);
      }
    });

    /**********************
     * زر حذف الأكواد المحفوظة
     **********************/
    clearSavedBtn.addEventListener('click', () => {
      if (!saved.length) {
        alert('لا توجد أكواد محفوظة للحذف.');
        return;
      }
      if (!confirm('هل أنت متأكد من حذف جميع الأكواد المحفوظة؟')) return;

      saved = [];
      saveSavedToStorage(); // سيحذف من localStorage
      refreshSavedTextarea();
    });

    /**********************
     * عند تحميل الصفحة — تأكد من تحميل saved للعرض
     **********************/
    // (loadSavedFromStorage داخل init ⇒ ينفّذ على DOMContentLoaded)
  </script>
</body>
</html>
