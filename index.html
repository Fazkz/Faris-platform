<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد أكواد الغذاء</title>
  <!-- استدعاء Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استدعاء Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- خط عربي -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    select, input { font-size: 14px; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 p-6">

  <h1 class="text-2xl font-bold mb-6 text-center">مولد أكواد الغذاء مع الحفظ والنسخ والحذف</h1>

  <!-- نموذج إدخال البيانات -->
  <form id="foodForm" class="bg-white p-6 rounded-lg shadow-md max-w-xl mx-auto mb-6 space-y-4">
    <div>
      <label class="block mb-1">اسم الطعام</label>
      <input type="text" id="name" required class="w-full border rounded p-2">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block mb-1">السعرات (لكل 100جم)</label>
        <input type="number" id="calories" step="0.01" required class="w-full border rounded p-2">
      </div>
      <div>
        <label class="block mb-1">الدهون (جم)</label>
        <input type="number" id="fat" step="0.01" required class="w-full border rounded p-2">
      </div>
      <div>
        <label class="block mb-1">الكربوهيدرات (جم)</label>
        <input type="number" id="carb" step="0.01" required class="w-full border rounded p-2">
      </div>
      <div>
        <label class="block mb-1">البروتين (جم)</label>
        <input type="number" id="protein" step="0.01" required class="w-full border rounded p-2">
      </div>
    </div>

    <!-- التصنيف الأساسي -->
    <div>
      <label class="block mb-1">التصنيف الأساسي</label>
      <select id="category" required class="w-full border rounded p-2">
        <option value="">اختر التصنيف</option>
      </select>
    </div>

    <!-- التصنيف الفرعي -->
    <div>
      <label class="block mb-1">التصنيف الفرعي</label>
      <select id="subcategory" required class="w-full border rounded p-2">
        <option value="">اختر التصنيف الفرعي</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded">➕ إضافة الكود</button>
  </form>

  <!-- الأكواد الناتجة -->
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md mb-6">
    <h2 class="text-xl font-semibold mb-2">الأكواد الناتجة</h2>
    <textarea id="codes" readonly class="w-full border rounded p-2 h-40"></textarea>
    <button id="copyBtn" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">📋 نسخ الكود</button>
  </div>

  <!-- الأكواد المحفوظة -->
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-semibold mb-2">الأكواد المحفوظة</h2>
    <textarea id="savedCodes" readonly class="w-full border rounded p-2 h-40"></textarea>
    <div class="flex gap-2 mt-2">
      <button id="moveToSavedBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded">💾 نقل للحافظة</button>
      <button id="copySavedBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">📋 نسخ</button>
      <button id="clearSavedBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded">🗑️ حذف</button>
    </div>
  </div>

  <script>
    // 🔹 بيانات التصنيفات
    const categories = {
      "الفواكه والخضروات": {
        icon: "fas fa-apple-alt",
        subcategories: ["فواكه", "خضراوات", "ورقيات", "سلطات", "عصائر طبيعية", "فواكة مجمدة", "خضراوات مجمدة", "مجففه"],
      },
      "الحليب و مشتقاته": {
        icon: "fa-solid fa-cheese",
        subcategories: ["الحليب", "الالبان", "الاجبان", "لبنه", "زبادي", "قشطة", "كريمة", "حليب مكثف", "حليب شاهي", "منتجات اخرى"],
      },
      "المخبوزات": {
        icon: "fa-solid fa-bread-slice",
        subcategories: ["مفرود", "صامولي و خبز برجر", "توست", "تورتيلا", "فطائر", "شابورة", "معمول", "مقرمشات", "مخبوزات صحية"],
      },
      "المشروبات": {
        icon: "fa-solid fa-bottle-water",
        subcategories: ["مشروبات غازية", "مشروبات طاقة", "مشروبات ساخنة", "مشروبات باردة", "عصائر", "اظرف سريعة التحضير"],
      },
      "السكريات": {
        icon: "fa-solid fa-ice-cream",
        subcategories: ["🍦ايسكريم", "شوكولاتة", "تمور", "كيك", "حلويات شرقية", "مارشميلو", "علك", "سكر"],
      },
      "موالح": {
        icon: "fa-solid fa-cookie-bite",
        subcategories: ["🍿شبسات", "فصفص", "مكسرات"],
      },
      "المعلبات": {
        icon: "bx bx-box",
        subcategories: ["حلاوة طحينية", "المربى", "الفول السوداني", "فواكة معلبة", "خضروات معلبة", "اسماك معلبة", "صلصات معلبة"],
      },
      "اللحوم والبيض": {
        icon: "fas fa-drumstick-bite",
        subcategories: ["بيض🥚", "لحم غنم🐑", "دواجن🐓", "بحريات🐟", "لحم بقري🐄", "لحم جمل🐪"],
      },
      "الحبوب والبذور": {
        icon: "fas fa-seedling",
        subcategories: ["حبوب كاملة", "رز🍚", "مكرونة🍝", "شعبيات", "شوربات", "كورن فليكس", "طحين", "بذور"],
      },
      "الزيوت و الدهون ": {
        icon: "fas fa-oil-can",
        subcategories: ["زيوت صحية", "زيوت", "زبدة", "صلصات"],
      },
      "مطاعم عالميه": {
        icon: "fa-solid fa-shop",
        subcategories: ["ماكدونالدز🍔", "🍗كنتاكي", "🍗هارديز", "🥪كودو", "دومينوز🍕"],
      },
    };

    // عناصر DOM
    const categorySelect = document.getElementById("category");
    const subcategorySelect = document.getElementById("subcategory");
    const form = document.getElementById("foodForm");
    const codesArea = document.getElementById("codes");
    const savedCodes = document.getElementById("savedCodes");
    const copyBtn = document.getElementById("copyBtn");
    const moveToSavedBtn = document.getElementById("moveToSavedBtn");
    const clearSavedBtn = document.getElementById("clearSavedBtn");
    const copySavedBtn = document.getElementById("copySavedBtn");

    let codes = [];
    let saved = JSON.parse(localStorage.getItem("savedFoodCodes") || "[]");

    // تحميل التصنيفات الأساسية
    Object.keys(categories).forEach(cat => {
      let option = document.createElement("option");
      option.value = cat;
      option.textContent = cat;
      categorySelect.appendChild(option);
    });

    // عند اختيار تصنيف أساسي → تحميل الفرعي
    categorySelect.addEventListener("change", () => {
      subcategorySelect.innerHTML = '<option value="">اختر التصنيف الفرعي</option>';
      if (categorySelect.value && categories[categorySelect.value]) {
        categories[categorySelect.value].subcategories.forEach(sub => {
          let option = document.createElement("option");
          option.value = sub;
          option.textContent = sub;
          subcategorySelect.appendChild(option);
        });
      }
    });

    // توليد ID إنجليزي
    function transliterateArabic(text) {
      const map = { "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"h","خ":"kh","د":"d","ذ":"dh","ر":"r","ز":"z","س":"s","ش":"sh","ص":"s","ض":"d","ط":"t","ظ":"z","ع":"a","غ":"gh","ف":"f","ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y","ى":"a","ء":"a","ئ":"e","ؤ":"o","ة":"h"," ":"_","-":"_"};
      return text.split("").map(ch => map[ch] || ch).join("").replace(/[^a-zA-Z0-9_]/g, "").toLowerCase();
    }

    // عند إضافة الكود
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const calories = parseFloat(document.getElementById("calories").value);
      const fat = parseFloat(document.getElementById("fat").value);
      const carb = parseFloat(document.getElementById("carb").value);
      const protein = parseFloat(document.getElementById("protein").value);
      const category = categorySelect.value;
      const subcategory = subcategorySelect.value;

      const id = transliterateArabic(name);

      const code = `{
  id: "${id}",
  name: "${name}",
  image: "sss",
  calories: ${calories},
  fat: ${fat},
  protein: ${protein},
  carb: ${carb},
  category: "${category}",
  subcategory: "${subcategory}",
},`;

      codes.push(code);
      codesArea.value = codes.join("\n\n");
      form.reset();
      subcategorySelect.innerHTML = '<option value="">اختر التصنيف الفرعي</option>';
    });

    // نسخ الأكواد
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(codesArea.value);
      copyBtn.textContent = "✅ تم النسخ!";
      setTimeout(() => copyBtn.textContent = "📋 نسخ الكود", 2000);
    });

    // نقل الأكواد للحافظة
    moveToSavedBtn.addEventListener("click", () => {
      if (codes.length === 0) return;
      saved.push(...codes);
      localStorage.setItem("savedFoodCodes", JSON.stringify(saved));
      savedCodes.value = saved.join("\n\n");
      codes = [];
      codesArea.value = "";
    });

    // نسخ الأكواد المحفوظة
    copySavedBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(savedCodes.value);
      copySavedBtn.textContent = "✅ تم النسخ!";
      setTimeout(() => copySavedBtn.textContent = "📋 نسخ", 2000);
    });

    // حذف الأكواد المحفوظة
    clearSavedBtn.addEventListener("click", () => {
      if (confirm("هل أنت متأكد من حذف الأكواد المحفوظة؟")) {
        saved = [];
        localStorage.removeItem("savedFoodCodes");
        savedCodes.value = "";
      }
    });

    // عند تحميل الصفحة → عرض الأكواد المحفوظة
    savedCodes.value = saved.join("\n\n");
  </script>
</body>
</html>
